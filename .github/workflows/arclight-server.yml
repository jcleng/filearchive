name: Minecraft Arclight Server Archive(installServer)

on:
  workflow_dispatch:
    inputs:
      java-version:
        description: 'Java version to use'
        required: true
        default: '21'
      arclight-version:
        description: 'Arclight release tag (GitHub release tag, "/" will be escaped)'
        required: true
        default: 'FeudalKings/1.0.1'
      arclight-jar:
        description: 'Arclight server jar filename'
        required: true
        default: 'arclight-forge-1.21.1-1.0.1-8ec9529.jar'
      tag_name:
        description: 'Release tag name'
        required: true
        default: 'arclight-forge-1.21.1-1.0.1'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - name: Download Arclight
        run: |
          rm -rf ./*
          # 让依赖(libraries/.arclight 等)落在工作目录内, 便于后续一起打包
          echo "HOME=$PWD" >> $GITHUB_ENV
          TAG_ENC="${ARCLIGHT_TAG//\//%2F}"
          wget "https://github.com/IzzelAliz/Arclight/releases/download/${TAG_ENC}/${ARCLIGHT_JAR}"
          ls -lah "${ARCLIGHT_JAR}"
        env:
          ARCLIGHT_TAG: ${{ inputs.arclight-version }}
          ARCLIGHT_JAR: ${{ inputs.arclight-jar }}

      - name: Run Arclight Server and download dependencies
        run: |
          set -uo pipefail
          EULA_RE="You need to agree to the EULA"

          # 轮询日志直到出现 EULA 提示 / 进程退出 / 超时
          # 返回 0=已到EULA, 1=进程退出, 2=超时
          wait_for_eula() {
            local log="$1" pid="$2" max=$3 i
            for ((i = 0; i < max; i++)); do
              if grep -q "$EULA_RE" "$log" 2>/dev/null; then return 0; fi
              if ! kill -0 "$pid" 2>/dev/null; then return 1; fi
              sleep 5
            done
            return 2
          }

          for attempt in 1 2 3; do
            echo "::group::Attempt ${attempt}: 运行 Arclight 下载依赖"
            rm -f arclight-install.log forge-launch.log

            # 阶段1: 用 arclight jar 启动, 它会下载 forge/fabric 依赖并生成 unix_args.txt
            java -Xmx6G -Xms4G -jar "${ARCLIGHT_JAR}" nogui > arclight-install.log 2>&1 &
            PID=$!
            wait_for_eula arclight-install.log "$PID" 720
            RC=$?
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true

            if [ "$RC" -eq 0 ]; then
              echo "::endgroup::"
              echo ">>> 阶段1: 已检测到 EULA 提示"
              break
            fi

            echo "::endgroup::"
            echo ">>> 阶段1 未检测到 EULA (rc=${RC}), 检查依赖与启动参数..."

            # 阶段2: 部分 Arclight 版本会在 mixin 注入阶段崩溃(上游 issue #1927),
            #        此时依赖其实已经装好, 改用 Arclight 生成的 unix_args.txt 走 Forge 启动路径
            ARGS_FILE="$(find libraries -name 'unix_args.txt' 2>/dev/null | head -1)"
            if [ -n "${ARGS_FILE}" ] && [ -f user_jvm_args.txt ]; then
              echo ">>> 使用生成的启动参数: ${ARGS_FILE}"
              java @user_jvm_args.txt @"${ARGS_FILE}" nogui > forge-launch.log 2>&1 &
              PID=$!
              wait_for_eula forge-launch.log "$PID" 360
              RC2=$?
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
              if [ "$RC2" -eq 0 ]; then
                echo ">>> 阶段2: 已检测到 EULA 提示, 依赖下载完成"
                break
              fi
              echo ">>> 阶段2 未检测到 EULA (rc=${RC2})"
            else
              echo ">>> 未找到 unix_args.txt / user_jvm_args.txt, 依赖可能未安装完整"
            fi

            echo ">>> 等待 15 秒后重试..."
            sleep 15
          done

          echo "===== arclight-install.log (末尾 40 行) ====="
          tail -n 40 arclight-install.log 2>/dev/null || true
          echo "===== forge-launch.log (末尾 40 行) ====="
          tail -n 40 forge-launch.log 2>/dev/null || true

          if grep -q "$EULA_RE" arclight-install.log forge-launch.log 2>/dev/null; then
            echo ">>> 成功: 检测到 EULA 提示"
          else
            echo "::warning::未检测到 EULA 提示, 请检查上面的日志"
          fi
        env:
          ARCLIGHT_JAR: ${{ inputs.arclight-jar }}

      - name: Zip server files
        run: |
          zip -r "minecraft-server-${TAG_NAME}.zip" . -x "*.git*" "arclight-install.log" "forge-launch.log"
          touch release.txt
          echo "Arclight">>release.txt
          echo "${ARCLIGHT_TAG}">>release.txt
          echo "${ARCLIGHT_JAR}">>release.txt
          echo "${ARCLIGHT_JAVA}">>release.txt
          echo "${ARCLIGHT_URL}">>release.txt
          sha256sum "minecraft-server-${TAG_NAME}.zip">>release.txt
          ls -lah "minecraft-server-${TAG_NAME}.zip">>release.txt
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          ARCLIGHT_TAG: ${{ inputs.arclight-version }}
          ARCLIGHT_JAR: ${{ inputs.arclight-jar }}
          ARCLIGHT_JAVA: ${{ inputs.java-version }}
          ARCLIGHT_URL: https://github.com/IzzelAliz/Arclight/releases/download/${{ inputs.arclight-version }}/${{ inputs.arclight-jar }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag_name }}
          body_path: release.txt
          files: |
            minecraft-server-${{ inputs.tag_name }}.zip
            ${{ inputs.arclight-jar }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
